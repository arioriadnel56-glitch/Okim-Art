# ============================================================
# render.yaml — déploiement "Blueprint" sur Render
# ============================================================
# CORRIGÉ (2 bugs bloquants pour un déploiement réel) :
#
# 1) L'ancienne version montait un disque persistant Render pour /uploads,
#    ce qui obligeait le plan payant "Starter" — exactement le problème que
#    la migration Cloudinary vient résoudre. Toutes les images/vidéos/fichiers
#    passent désormais par Cloudinary (voir server/utils/upload.js) : plus
#    aucun disque persistant n'est nécessaire, donc le plan "free" suffit.
#
# 2) L'ancienne version déclarait une base PostgreSQL gérée par RENDER
#    (bloc "databases:" + "fromDatabase") et branchait DATABASE_URL dessus
#    automatiquement — ce qui aurait ÉCRASÉ silencieusement votre base
#    SUPABASE réelle par une base Render vide au déploiement. DATABASE_URL
#    doit être collé à la main dans le dashboard Render (valeur secrète,
#    "sync: false" ci-dessous = Render vous la demande sans la stocker dans
#    ce fichier versionné).
services:
  - type: web
    name: okim-art-platform
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Généré automatiquement par Render au premier déploiement — vous
      # n'avez rien à saisir, et il ne sera jamais visible dans ce fichier.
      - key: JWT_SECRET
        generateValue: true

      # Base de données Supabase — collez votre "Connection string" (mode
      # "Session pooler", port 5432) depuis Supabase > Project Settings >
      # Database > Connection string. sync:false = Render vous demandera
      # la valeur lors du premier déploiement, sans jamais l'écrire ici.
      - key: DATABASE_URL
        sync: false

      # Ne PAS mettre "false" ici : Supabase exige TLS (voir server/db.js).
      - key: PGSSL
        value: "true"

      # Premier compte admin — email en clair (pas un secret), mot de passe
      # volontairement absent : laissez-le vide pour que le serveur en
      # génère un fort tout seul au premier démarrage (voir ADMIN-IDENTIFIANTS.txt).
      - key: FIRST_ADMIN_EMAIL
        sync: false

      # Cloudinary — dashboard.cloudinary.com > Dashboard, les 3 valeurs
      # apparaissent directement en haut de page.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_VIDEO_FOLDER
        value: okimart/videos

      # Un proxy supplémentaire (le site statique) se trouve devant l'API : voir
      # server/server.js. Vérifiez sur /api/health que "client_ip" est bien votre IP.
      - key: TRUST_PROXY_HOPS
        value: "2"

  # ------------------------------------------------------------------
  # SITE STATIQUE (vitrine + pages + admin) — toujours éveillé, gratuit,
  # servi par le CDN Render : n'utilise AUCUNE des 750 h du service web.
  # Un visiteur ouvre donc toujours la vitrine instantanément ; le backend
  # n'est réveillé (par okim-core.js) que si une fonctionnalité serveur est
  # utilisée. /api/* est relayé vers le backend (même origine => cookies de
  # session inchangés, aucun CORS à configurer).
  #
  # ⚠ Remplacez "okim-art-platform.onrender.com" ci-dessous si l'URL réelle
  # de votre service web est différente (Dashboard Render > service web).
  # ------------------------------------------------------------------
  - type: web
    name: okim-art-web
    runtime: static
    buildCommand: node scripts/build-static.js
    staticPublishPath: ./dist
    envVars:
      # URL CDN de l'instantané public, affichée dans les logs du backend
      # ("[snapshot] URL publique de l'instantané : ..."). Laisser vide au
      # premier déploiement, puis la renseigner et redéployer le site statique.
      - key: OKIM_SNAPSHOT_URL
        sync: false
      - key: SITE_URL
        sync: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://okim-art-platform.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://okim-art-platform.onrender.com/uploads/*
      - type: rewrite
        source: /gallery/*
        destination: /gallery.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /js/*
        name: Cache-Control
        value: no-cache
      - path: /css/*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
