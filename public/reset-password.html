<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — OKIM ART</title>
<link rel="icon" href="/img/brand/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/img/brand/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/img/brand/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#141a30">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body>

<header class="nav scrolled" id="nav">
  <a href="index.html" class="brand"><img src="img/brand/logo.png" alt="OKIM ART" class="brand-logo"> OKIM ART</a>
  <nav class="nav-links">
    <a href="boutique.html">Boutique</a>
    <a href="logiciels.html">Outils &amp; Logiciels</a>
    <a href="index.html#contact">Contact</a>
  </nav>
  <div class="nav-right">
    <a href="compte.html" class="btn btn-ghost nav-cta" style="padding:.6rem 1.1rem">Espace client</a>
  </div>
</header>

<section class="page-hero">
  <div class="wrap">
    <p class="eyebrow" style="justify-content:center"><span></span>Espace client</p>
    <h1>Choisir un nouveau mot de passe</h1>
  </div>
</section>

<section class="page-section">
  <div class="wrap">

    <div class="form-card" style="margin:0 auto" id="reset-card">
      <div class="form-error" id="reset-error"></div>
      <form id="reset-form">
        <div class="field"><label>Nouveau mot de passe (8 caractères min.)</label><input type="password" id="rp-password" minlength="8" required></div>
        <div class="field"><label>Confirmer le mot de passe</label><input type="password" id="rp-password2" minlength="8" required></div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center">Réinitialiser mon mot de passe</button>
      </form>
    </div>

    <div class="form-card" style="margin:0 auto; display:none; text-align:center" id="reset-success-card">
      <p style="font-size:1.05rem">Votre mot de passe a bien été mis à jour.</p>
      <a href="compte.html" class="btn btn-primary" style="width:100%; justify-content:center">Se connecter</a>
    </div>

    <div class="form-card" style="margin:0 auto; display:none; text-align:center" id="reset-invalid-card">
      <p style="font-size:1.05rem">Ce lien de réinitialisation est invalide ou manquant.</p>
      <a href="compte.html" class="btn btn-ghost" style="width:100%; justify-content:center">Retour à l'espace client</a>
    </div>

  </div>
</section>

<footer>
  <span class="f-brand"><img src="img/brand/logo.png" alt="" class="f-brand-logo">OKIM ART</span>
  <div class="f-socials">
    <a href="#" id="f-instagram">Instagram</a>
    <a href="#" id="f-facebook">Facebook</a>
    <a href="index.html#contact">Contact</a>
  </div>
  <a href="#nav" class="to-top" aria-label="Retour en haut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg></a>
</footer>

<script src="js/site-data.js"></script>
<script>
(function(){
  var token = new URLSearchParams(location.search).get("token");
  if(!token){
    document.getElementById("reset-card").style.display = "none";
    document.getElementById("reset-invalid-card").style.display = "block";
    return;
  }

  document.getElementById("reset-form").addEventListener("submit", function(e){
    e.preventDefault();
    var err = document.getElementById("reset-error"); err.classList.remove("show");
    var p1 = document.getElementById("rp-password").value, p2 = document.getElementById("rp-password2").value;
    if(p1 !== p2){ err.textContent = "Les deux mots de passe ne correspondent pas."; err.classList.add("show"); return; }

    fetch("/api/auth/client/reset-password", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ token: token, nouveau_mot_de_passe: p1 }) })
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, data:d}; }); })
      .then(function(res){
        if(res.status !== 200) throw new Error(res.data.error || "Ce lien est invalide ou a expiré.");
        document.getElementById("reset-card").style.display = "none";
        document.getElementById("reset-success-card").style.display = "block";
      }).catch(function(e2){ err.textContent = e2.message; err.classList.add("show"); });
  });
})();
</script>
</body>
</html>
