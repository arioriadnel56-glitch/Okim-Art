<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/js/okim-core.js"></script>
<meta name="robots" content="noindex">
<title>OKIM ART — Téléchargement</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141a30;color:#f5f1e6;font-family:'Work Sans',system-ui,sans-serif;text-align:center;padding:1.5rem}
  .c{max-width:420px}
  img{width:84px;height:auto;margin-bottom:1.2rem}
  h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.5rem;margin:0 0 .7rem;color:#fffdf8}
  p{margin:0 0 1.2rem;line-height:1.6;color:#d9cfb6}
  a{display:inline-block;border-radius:999px;padding:.75rem 1.6rem;border:1px solid #b18d54;background:#b18d54;color:#141a30;text-decoration:none;font-weight:500}
</style>
</head>
<body>
<div class="c">
  <img src="/img/brand/logo.png" alt="OKIM ART">
  <h1 id="t">Préparation de votre téléchargement…</h1>
  <p id="m">Votre fichier va démarrer automatiquement.</p>
  <a id="a" href="/" style="display:none">Retour à l'accueil</a>
</div>
<script>
(function(){
  var token = new URLSearchParams(location.search).get("t");
  if(!token || !/^[A-Za-z0-9_-]{8,128}$/.test(token)){
    document.getElementById("t").textContent = "Lien invalide";
    document.getElementById("m").textContent = "Ce lien de téléchargement est incomplet. Utilisez le lien reçu par e-mail.";
    document.getElementById("a").style.display = "inline-block"; return;
  }
  // Réveille le serveur (animation OKIM ART) AVANT de lancer le téléchargement : un seul essai, jeton consommé une seule fois.
  OkimApi.ensureAwake(true).then(function(ok){
    if(!ok){
      document.getElementById("t").textContent = "Téléchargement indisponible pour le moment";
      document.getElementById("m").textContent = "Veuillez réessayer dans quelques instants en rouvrant le lien de votre e-mail.";
      document.getElementById("a").style.display = "inline-block"; return;
    }
    location.replace("/api/download/" + encodeURIComponent(token));
  });
})();
</script>
</body>
</html>
